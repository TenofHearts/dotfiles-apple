# Migrated from TenofHearts/dotfiles-win, commit 92d8fcf.
# Linked to ~/.config/aerospace/aerospace.toml.
config-version = 2
start-at-login = false
auto-reload-config = false

on-focused-monitor-changed = [
    'move-mouse monitor-lazy-center',
]
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Gaps and margins inherit AeroSpace defaults (zero).

# Browser picture-in-picture windows float; Windows process/class rules do not apply.

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.edgemac'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[mode.main.binding]
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-shift-semicolon = "mode command"

[mode.command.binding]
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
h = ["mode main", "exec-and-forget open \"$HOME/.config/aerospace/help.html\""]
m = "mode move"
r = "mode adjust"
a = "mode admin"
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode main"

[mode.move.binding]
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
h = "move left"
j = "move down"
k = "move up"
l = "move right"
v = "layout tiles horizontal vertical"
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode command"
1 = "move-node-to-workspace --focus-follows-window 1"
2 = "move-node-to-workspace --focus-follows-window 2"
3 = "move-node-to-workspace --focus-follows-window 3"
4 = "move-node-to-workspace --focus-follows-window 4"
5 = "move-node-to-workspace --focus-follows-window 5"
6 = "move-node-to-workspace --focus-follows-window 6"
7 = "move-node-to-workspace --focus-follows-window 7"
8 = "move-node-to-workspace --focus-follows-window 8"
9 = "move-node-to-workspace --focus-follows-window 9"

# Native resizing in 25-point steps.
# Space toggles floating without an added centering helper.
[mode.adjust.binding]
h = "resize width -25"
j = "resize height +25"
k = "resize height -25"
l = "resize width +25"
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
t = "layout tiling"
f = "fullscreen"
space = "layout floating tiling"
m = "macos-native-minimize"
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode command"

# P pauses management; resume manually from the menu-bar icon or CLI.
# Return to main before pausing so manual resume restores normal typing.
[mode.admin.binding]
p = ["mode main", "enable off"]
alt-h = "focus left"
alt-j = "focus down"
alt-k = "focus up"
alt-l = "focus right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
r = ["mode main", "reload-config"]
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode command"

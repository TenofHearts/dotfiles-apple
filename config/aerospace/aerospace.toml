# Migrated from TenofHearts/dotfiles-win, commit 92d8fcf.
# Linked to ~/.config/aerospace/aerospace.toml.
config-version = 2
start-at-login = false
auto-reload-config = false

# Update the mode label immediately instead of waiting for workspace polling.
on-mode-changed = [
    'exec-and-forget /bin/bash "$HOME/.config/sketchybar/plugins/aerospace-mode.sh"',
]

# Workspace indicators use a persistent `aerospace subscribe` listener,
# started and supervised by SketchyBar.

on-focused-monitor-changed = [
    'move-mouse monitor-lazy-center',
]
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'
persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
# Remove redundant single-child containers automatically.
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Space between tiles and around the workspace (macOS logical points).
[gaps]
inner.horizontal = 2
inner.vertical = 2
outer.left = 5
outer.right = 5
# Automatically measured menu/bar height minus the macOS inset, plus 5 points.
outer.top = [{ monitor."1" = 6 }, 38] # managed by sketchybar display-layout.py
outer.bottom = 5

# Browser picture-in-picture windows float; Windows process/class rules do not apply.

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.edgemac'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
if.window-title-regex-substring = '[Pp]icture.in.[Pp]icture'
run = 'layout floating'

[mode.main.binding]
alt-h = "focus --boundaries all-monitors-outer-frame left"
alt-j = "focus --boundaries all-monitors-outer-frame down"
alt-k = "focus --boundaries all-monitors-outer-frame up"
alt-l = "focus --boundaries all-monitors-outer-frame right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
alt-shift-semicolon = "mode command"

[mode.command.binding]
alt-h = "focus --boundaries all-monitors-outer-frame left"
alt-j = "focus --boundaries all-monitors-outer-frame down"
alt-k = "focus --boundaries all-monitors-outer-frame up"
alt-l = "focus --boundaries all-monitors-outer-frame right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
h = ["mode main", "exec-and-forget open \"$HOME/.config/aerospace/help.html\""]
m = "mode move"
r = "mode adjust"
a = "mode admin"
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode main"

[mode.move.binding]
alt-h = "focus --boundaries all-monitors-outer-frame left"
alt-j = "focus --boundaries all-monitors-outer-frame down"
alt-k = "focus --boundaries all-monitors-outer-frame up"
alt-l = "focus --boundaries all-monitors-outer-frame right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
h = "move --boundaries all-monitors-outer-frame left"
j = "move --boundaries all-monitors-outer-frame down"
k = "move --boundaries all-monitors-outer-frame up"
l = "move --boundaries all-monitors-outer-frame right"
shift-h = "move-workspace-to-monitor left"
shift-j = "move-workspace-to-monitor down"
shift-k = "move-workspace-to-monitor up"
shift-l = "move-workspace-to-monitor right"
v = "mode join"
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode command"
1 = "move-node-to-workspace --focus-follows-window 1"
2 = "move-node-to-workspace --focus-follows-window 2"
3 = "move-node-to-workspace --focus-follows-window 3"
4 = "move-node-to-workspace --focus-follows-window 4"
5 = "move-node-to-workspace --focus-follows-window 5"
6 = "move-node-to-workspace --focus-follows-window 6"
7 = "move-node-to-workspace --focus-follows-window 7"
8 = "move-node-to-workspace --focus-follows-window 8"
9 = "move-node-to-workspace --focus-follows-window 9"

# One-shot directional join, entered with V from Move mode.
[mode.join.binding]
alt-h = "focus --boundaries all-monitors-outer-frame left"
alt-j = "focus --boundaries all-monitors-outer-frame down"
alt-k = "focus --boundaries all-monitors-outer-frame up"
alt-l = "focus --boundaries all-monitors-outer-frame right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
h = ["join-with left", "mode move"]
j = ["join-with down", "mode move"]
k = ["join-with up", "mode move"]
l = ["join-with right", "mode move"]
esc = "mode move"
enter = "mode move"
alt-shift-semicolon = "mode command"

# Native resizing in 25-point steps.
# Space toggles floating without an added centering helper.
[mode.adjust.binding]
# Toggle the focused container (group, or workspace root) without flattening.
a = "layout accordion tiles"
h = "resize width -25"
j = "resize height +25"
k = "resize height -25"
l = "resize width +25"
alt-h = "focus --boundaries all-monitors-outer-frame left"
alt-j = "focus --boundaries all-monitors-outer-frame down"
alt-k = "focus --boundaries all-monitors-outer-frame up"
alt-l = "focus --boundaries all-monitors-outer-frame right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
t = "layout tiling"
f = "fullscreen --no-outer-gaps"
space = "layout floating tiling"
m = "macos-native-minimize"
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode command"

# P pauses management; resume manually from the menu-bar icon or CLI.
# Return to main before pausing so manual resume restores normal typing.
[mode.admin.binding]
p = ["mode main", "enable off"]
alt-h = "focus --boundaries all-monitors-outer-frame left"
alt-j = "focus --boundaries all-monitors-outer-frame down"
alt-k = "focus --boundaries all-monitors-outer-frame up"
alt-l = "focus --boundaries all-monitors-outer-frame right"
alt-m = "macos-native-minimize"
alt-q = "close"
alt-1 = "workspace 1"
alt-2 = "workspace 2"
alt-3 = "workspace 3"
alt-4 = "workspace 4"
alt-5 = "workspace 5"
alt-6 = "workspace 6"
alt-7 = "workspace 7"
alt-8 = "workspace 8"
alt-9 = "workspace 9"
r = ["mode main", "reload-config"]
esc = "mode main"
enter = "mode main"
alt-shift-semicolon = "mode command"

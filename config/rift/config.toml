# Linked to ~/.config/rift/config.toml.
# Workspace and mode updates are streamed to the SbarLua configuration.
[settings]
animate = false
default_disable = false
hot_reload = false
focus_follows_mouse = false
mouse_follows_focus = false
mouse_hides_on_focus = false
run_on_start = []

# AeroSpace tiles and accordion map to Rift's traditional layout and stack toggle.
[settings.layout]
mode = 'traditional'
[settings.layout.traditional]
equalize_nodes = true
[settings.layout.stack]
stack_offset = 20.0
default_orientation = 'same'
[settings.layout.scrolling]
animate = false

# Space between tiles and around the workspace (macOS logical points).
[settings.layout.gaps]
inner.horizontal = 2
inner.vertical = 2
outer.left = 5
outer.right = 5
outer.top = 5
outer.bottom = 5
# Automatically measured menu/bar height minus Rift's native inset, plus 5 points.
# BEGIN managed display gaps
[settings.layout.gaps.per_display."37D8832A-2D66-02CA-B9F7-8F30A301B230".outer]
top = 6
left = 5
right = 5
bottom = 5
# END managed display gaps

# Keep Rift-only UI, gestures, and modifier dragging disabled during the trial.
[settings.ui.mission_control]
enabled = false
[settings.ui.menu_bar]
enabled = false
[settings.ui.stack_line]
enabled = false
[settings.gestures]
enabled = false
[settings.drag_drop]
enabled = false

# These are Rift virtual workspaces inside each native macOS Space.
[virtual_workspaces]
enabled = true
default_workspace_count = 9
workspace_names = ['1', '2', '3', '4', '5', '6', '7', '8', '9']
auto_assign_windows = true
preserve_focus_per_workspace = true
workspace_auto_back_and_forth = false
reapply_app_rules_on_title_change = false

# Call windows keep their own size rather than participate in tiling.
[[virtual_workspaces.app_rules]]
app_id = "com.tencent.xinWeChat"
title_regex = "(?i)(视频通话|语音通话|视频聊天|语音聊天|video call|voice call)"
floating = true

# Browser picture-in-picture windows float.
# Rift 0.7 rejects duplicate regex strings across apps; equivalent groups avoid it.
[[virtual_workspaces.app_rules]]
app_id = "com.google.Chrome"
title_regex = "(?:[Pp]icture.in.[Pp]icture)"
floating = true

[[virtual_workspaces.app_rules]]
app_id = "org.mozilla.firefox"
title_regex = "(?:(?:[Pp]icture.in.[Pp]icture))"
floating = true

[[virtual_workspaces.app_rules]]
app_id = "com.apple.Safari"
title_regex = "(?:(?:(?:[Pp]icture.in.[Pp]icture)))"
floating = true

[[virtual_workspaces.app_rules]]
app_id = "com.microsoft.edgemac"
title_regex = "(?:(?:(?:(?:[Pp]icture.in.[Pp]icture))))"
floating = true

[[virtual_workspaces.app_rules]]
app_id = "com.brave.Browser"
title_regex = "(?:(?:(?:(?:(?:[Pp]icture.in.[Pp]icture)))))"
floating = true

[[virtual_workspaces.app_rules]]
app_id = "app.zen-browser.zen"
title_regex = "(?:(?:(?:(?:(?:(?:[Pp]icture.in.[Pp]icture))))))"
floating = true

# Left Option shortcuts are defined in skhd; plain mode keys stay here.
# Rift reserves the name "default" for AeroSpace's "main" mode.
[keys]

[binding_modes.command]
"M" = { binding_mode = "move" }
"R" = { binding_mode = "adjust" }
"A" = { binding_mode = "admin" }
"Shift + Slash" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default && exec open \"$HOME/.config/rift/help.html\""] }
"Escape" = { binding_mode = "default" }
"Enter" = { binding_mode = "default" }

# Directional window/workspace moves, then one-shot Join with V.
[binding_modes.move]
"H" = { move_node = "left" }
"J" = { move_node = "down" }
"K" = { move_node = "up" }
"L" = { move_node = "right" }
"Shift + H" = { move_workspace_to_display = { selector = "left" } }
"Shift + J" = { move_workspace_to_display = { selector = "down" } }
"Shift + K" = { move_workspace_to_display = { selector = "up" } }
"Shift + L" = { move_workspace_to_display = { selector = "right" } }
"V" = { binding_mode = "join" }
"1" = { move_window_to_workspace = { workspace = 0, follow = true } }
"2" = { move_window_to_workspace = { workspace = 1, follow = true } }
"3" = { move_window_to_workspace = { workspace = 2, follow = true } }
"4" = { move_window_to_workspace = { workspace = 3, follow = true } }
"5" = { move_window_to_workspace = { workspace = 4, follow = true } }
"6" = { move_window_to_workspace = { workspace = 5, follow = true } }
"7" = { move_window_to_workspace = { workspace = 6, follow = true } }
"8" = { move_window_to_workspace = { workspace = 7, follow = true } }
"9" = { move_window_to_workspace = { workspace = 8, follow = true } }
"Escape" = { binding_mode = "default" }
"Enter" = { binding_mode = "default" }

# One-shot directional Join; preserve AeroSpace perpendicular grouping.
[binding_modes.join]
"H" = { exec = ["/bin/sh", "-c", "exec lua \"$HOME/.config/rift/scripts/join.lua\" left"] }
"J" = { exec = ["/bin/sh", "-c", "exec lua \"$HOME/.config/rift/scripts/join.lua\" down"] }
"K" = { exec = ["/bin/sh", "-c", "exec lua \"$HOME/.config/rift/scripts/join.lua\" up"] }
"L" = { exec = ["/bin/sh", "-c", "exec lua \"$HOME/.config/rift/scripts/join.lua\" right"] }
"Escape" = { binding_mode = "move" }
"Enter" = { binding_mode = "move" }

# Native Rift resize steps are ~5%, rather than AeroSpace’s 25 points.
[binding_modes.adjust]
# Whole-workspace layouts: direct selection or cycling with Space.
"1" = { set_workspace_layout = { mode = "traditional" } }
"2" = { set_workspace_layout = { mode = "bsp" } }
"3" = { set_workspace_layout = { mode = "master_stack" } }
"4" = { set_workspace_layout = { mode = "scrolling" } }
"5" = { set_workspace_layout = { mode = "stack" } }
"6" = { set_workspace_layout = { mode = "floating" } }
"A" = "toggle_stack"
"H" = { resize_window_shrink = "horizontal" }
"J" = { resize_window_grow = "vertical" }
"K" = { resize_window_shrink = "vertical" }
"L" = { resize_window_grow = "horizontal" }
"T" = { exec = ["/bin/sh", "-c", "exec python3 \"$HOME/.config/window-manager/control.py\" tile"] }
"F" = "toggle_fullscreen"
"Space" = { exec = ["/bin/sh", "-c", "exec lua \"$HOME/.config/rift/scripts/cycle-layout.lua\""] }
"Shift + Space" = "toggle_window_floating"
"Escape" = { binding_mode = "default" }
"Enter" = { binding_mode = "default" }

# P resets the mode and stops Rift; resume through the shared manager helper.
[binding_modes.admin]
"P" = { exec = ["/bin/sh", "-c", "exec python3 \"$HOME/.config/window-manager/control.py\" pause"] }
"R" = { exec = ["/bin/sh", "-c", "rift-cli execute binding-mode default && exec rift-cli execute config reload"] }
"Escape" = { binding_mode = "default" }
"Enter" = { binding_mode = "default" }

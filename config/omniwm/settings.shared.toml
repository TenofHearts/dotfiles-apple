# OmniWM 0.7.6; skhd + SketchyBar own the hotkeys and bar.
# Overview stays disabled until its search bar respects the camera-notch safe area.
hotkeys = []
monitorBarOverrides = []
monitorDwindleOverrides = []
# Machine-specific values are read from ignored monitors.local.toml.
monitorGapOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []
schemaVersion = 4

[appearance]
mode = "automatic"
tabRailAppIcons = true

[borders]
enabled = true
width = 1.0

[borders.color]
alpha = 1.0
blue = 0.961
green = 0.4
red = 0.118

[borders.darkColor]
alpha = 1.0
blue = 0.98
green = 0.706
red = 0.537

[borders.glow]
enabled = true
opacity = 0.3
radius = 7.0

[borders.gradient]
direction = "topLeftToBottomRight"
enabled = true

[borders.gradient.dark]

[borders.gradient.dark.end]
alpha = 1.0
blue = 0.969
green = 0.651
red = 0.796

[borders.gradient.dark.start]
alpha = 1.0
blue = 0.98
green = 0.706
red = 0.537

[borders.gradient.end]
alpha = 1.0
blue = 0.956
green = 0.337
red = 0.533

[borders.gradient.start]
alpha = 1.0
blue = 0.961
green = 0.4
red = 0.118

[clipboard]
historyEnabled = false
ignoredTypes = []
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
# A large custom cap fills the tiled frame with gaps; "fill" ignores those gaps.
singleWindowFit = "100000x100000"
smartSplit = false
splitWidthMultiplier = 1.0
useGlobalGaps = true

[focus]
crossesMonitorAtEdge = true
followsMouse = false
followsWindowToMonitor = true
lockModifier = "off"
moveCrossesMonitorAtEdge = true
moveMouseToFocusedWindow = false
raiseOnMouseFocus = false

[gaps]
fullscreenUsesOuterGaps = false
size = 2.0

[gaps.outer]
bottom = 5.0
left = 5.0
right = 5.0
top = 38.0

[general]
animationSpeed = 1.0
animationsEnabled = true
defaultLayoutType = "dwindle"
hotkeysEnabled = false
hyperKeyModifiers = "Control+Option+Shift+Command"
ipcEnabled = true
preventSleepEnabled = false
systemHyperTrigger = "None"
updateChecksEnabled = true

[gestures]
fingerCount = 3
invertDirection = true
mouseMoveModifierKey = "option"
mouseResizeModifierKey = "option"
overviewGestureEnabled = false
overviewGestureFingerCount = 4
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 5.0
trackpadScrollStyle = "momentum"
windowGestureSensitivity = 1.0
windowMoveEnabled = false
windowMoveFingerCount = 4
windowResizeEnabled = false
windowResizeFingerCount = 3
workspaceSwipeAxis = "vertical"
workspaceSwipeEnabled = true
workspaceSwipeFingerCount = 3

[hiddenBar]
enabled = false
hiddenBundleIDs = []
rehideIntervalSeconds = 5.0

[mouseWarp]
constrainToArrangement = false
enabled = false
margin = 1

[niri]
alwaysCenterSingleColumn = false
centerFocusedColumn = "onOverflow"
containerPrimarySpanPresets = [0.3333333333333333, 0.5, 0.6666666666666666]
edgeGaps = true
infiniteLoop = false
resizeStepPercent = 5
# Match Dwindle's gap-preserving single-window frame.
singleWindowFit = "100000x100000"
visibleContainerCount = 2

[overview]
# 0.7.6 has no search-only visibility/offset setting; keep notch-side space usable.
enabled = false
invertScrollDirection = false
matchFocusBorder = true
mouseScrollSpeed = 1.0
zoom = 0.9

[overview.backdrop]
alpha = 1.0
blue = 0.08
green = 0.05
red = 0.05

[overview.windowBorders]

[overview.windowBorders.hovered]
alpha = 1.0
blue = 1.0
green = 0.6
red = 0.4

[overview.windowBorders.normal]
alpha = 0.5
blue = 0.35
green = 0.3
red = 0.3

[overview.windowBorders.selected]
alpha = 1.0
blue = 0.4
green = 0.8
red = 0.3

[quakeTerminal]
animationDuration = 0.25
autoHide = true
backgroundBlurRadius = 20
backgroundEffect = "glassRegular"
enabled = true
heightPercent = 50.0
monitorMode = "focusedWindow"
opacity = 0.92
position = "top"
widthPercent = 80.0

[routing]
arrangements = []
mode = "macOS"

[scratchpads]

[scratchpads.labels]

[statusBar]
showAppNames = false
showIcon = true
showWorkspaceName = false
useWorkspaceId = false

[workspaceBar]
autoHide = false
autoHideHideDelayMilliseconds = 0.0
autoHideRevealDelayMilliseconds = 0.0
backgroundOpacity = 0.1
deduplicateAppIcons = false
enabled = false
excludedBundleIDs = []
